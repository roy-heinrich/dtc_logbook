name: Supabase Keepalive

on:
  schedule:
    # Temporary test cadence: runs every 10 minutes.
    - cron: "*/10 * * * *"
    # Runs daily at 03:17 UTC.
    - cron: "17 3 * * *"

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run read-only heartbeat query
        env:
          SUPABASE_DB_HOST: aws-1-ap-southeast-1.pooler.supabase.com
          SUPABASE_DB_PORT: "6543"
          SUPABASE_DB_NAME: postgres
          SUPABASE_DB_USER: postgres.thzavgsxboykvhyxdcmb
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "SUPABASE_DB_PASSWORD secret is not set."
            exit 1
          fi

          SUPABASE_DB_PASSWORD="$(printf '%s' "$SUPABASE_DB_PASSWORD" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"

          # Keep activity read-only; this should not modify data.
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql \
            -h "$SUPABASE_DB_HOST" \
            -p "$SUPABASE_DB_PORT" \
            -U "$SUPABASE_DB_USER" \
            -d "$SUPABASE_DB_NAME" \
            -v ON_ERROR_STOP=1 \
            -c "SELECT 1;"
