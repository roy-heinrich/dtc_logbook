name: Supabase Keepalive

on:
  schedule:
    # Runs daily at 03:17 UTC.
    - cron: "17 3 * * *"

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run read-only heartbeat query
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL secret is not set."
            exit 1
          fi

          SUPABASE_DB_URL="$(printf '%s' "$SUPABASE_DB_URL" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"

          SUPABASE_DB_URL="${SUPABASE_DB_URL#postgresql://}"
          SUPABASE_DB_URL="${SUPABASE_DB_URL#postgres://}"

          SUPABASE_USER="${SUPABASE_DB_URL%%:*}"
          SUPABASE_REST="${SUPABASE_DB_URL#*:}"
          SUPABASE_PASSWORD="${SUPABASE_REST%%@*}"
          SUPABASE_HOSTPORT_DB="${SUPABASE_REST#*@}"
          SUPABASE_HOSTPORT="${SUPABASE_HOSTPORT_DB%%/*}"
          SUPABASE_DBNAME="${SUPABASE_HOSTPORT_DB#*/}"
          SUPABASE_HOST="${SUPABASE_HOSTPORT%%:*}"
          SUPABASE_PORT="${SUPABASE_HOSTPORT#*:}"

          # Keep activity read-only; this should not modify data.
          PGPASSWORD="$SUPABASE_PASSWORD" psql \
            -h "$SUPABASE_HOST" \
            -p "$SUPABASE_PORT" \
            -U "$SUPABASE_USER" \
            -d "$SUPABASE_DBNAME" \
            -v ON_ERROR_STOP=1 \
            -c "SELECT 1;"
